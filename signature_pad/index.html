<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
        }
        .sig-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        #sig-canvas {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: crosshair;
            background: #ffffff;
            touch-action: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: border-color 0.2s;
        }
        #sig-canvas:hover {
            border-color: #cbd5e1;
        }
        .sig-buttons {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }
        .sig-btn {
            padding: 8px 24px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }
        .sig-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
        }
        .sig-btn:active {
            transform: scale(0.98);
        }
        .sig-btn.clear {
            color: #ef4444;
            border-color: #fca5a5;
        }
        .sig-btn.clear:hover {
            background: #fef2f2;
            border-color: #f87171;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="sig-container">
        <canvas id="sig-canvas" width="350" height="250"></canvas>
        <div class="sig-buttons">
            <button class="sig-btn clear" onclick="clearCanvas()">🗑️ Hapus Coretan</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let hasDrawn = false;
        
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000000';

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - r.left, y: t.clientY - r.top };
        }
        
        function startDraw(e) {
            e.preventDefault();
            drawing = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
        }
        
        function draw(e) {
            e.preventDefault();
            if (!drawing) return;
            hasDrawn = true;
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        
        function stopDraw(e) {
            e.preventDefault();
            if (drawing) {
                drawing = false;
                sendValue();
            }
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasDrawn = false;
            sendValue();
        }

        function sendValue() {
            const dataUrl = hasDrawn ? canvas.toDataURL('image/png') : '';
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: dataUrl
            }, "*");
        }

        // Initialize handshake with Streamlit
        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                // Initialize frame properties
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "streamlit:setFrameHeight",
                    height: 310
                }, "*");
            }
        });

        // Notify Streamlit that the component is loaded
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1
        }, "*");
    </script>
</body>
</html>
